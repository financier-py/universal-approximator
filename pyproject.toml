[project]
name = "universal-approximator"
version = "0.1.0"
description = "Interactive demo of the universal approximation theorem: watch an MLP or gradient boosting fit any f(x)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "plotly>=6.9.0",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "streamlit>=1.61.1",
    "sympy>=1.14.0",
    "torch>=2.13.0",
]
